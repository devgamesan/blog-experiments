[project]
name = "yolo-detection-notebook"
version = "0.1.0"
description = "YOLOv4 object detection notebook environment using OpenCV DNN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "opencv-python>=4.10,<5",
    "pandas>=2.2",
    "pillow>=10.4",
]
